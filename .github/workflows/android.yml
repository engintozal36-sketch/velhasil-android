
name: Velhasil Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bagimliliklari kur
        run: npm install

      - name: Android projesini olustur
        run: npx expo prebuild --platform android --non-interactive

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          /gradlew ./gradlew assembleRelease -Pandroid.injected.signing.store.file=app/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android --no-daemon -Pandroid.injected.signing.key.password=android --no-daemon

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Velhasil-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
